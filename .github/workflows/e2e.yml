name: E2E

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリチェック
        uses: actions/checkout@v7

      - name: bun セットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: インストール
        run: bun install --frozen-lockfile

      - name: Playwright のブラウザと OS の依存をインストール
        working-directory: e2e
        run: ../node_modules/.bin/playwright install --with-deps chromium

      # DB はインメモリの PGlite を e2e/scripts/startTestServer.ts が起動するため、secrets も外部の DB も使わない。
      - name: E2E テスト
        run: bun run test:e2e

      - name: 失敗時のレポートとトレースを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
