name: Deploy Frontend to S3

on:
  # monorepo 化に伴い参照パスを apps/web へ移したうえで、自動デプロイは停止して
  # 手動実行のみとする。AWS 構成（infra/）の扱いは #293 で判断するため、
  # 移行期間中に S3 へ配信し続ける必要がない。
  # AWS リソースを aws-down で停止している間もワークフローが失敗しない利点もある。
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリチェック
        uses: actions/checkout@v7

      - name: bun セットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: 依存関係インストール
        run: bun install --frozen-lockfile

      - name: ビルド（静的エクスポート）
        run: bun run build:web
        env:
          DEPLOY_TARGET: aws
          NEXT_PUBLIC_API_URL: "https://api-aws.patient-management-kubo-works-projects.com"
          NEXT_PUBLIC_FRONT_URL: "https://aws.patient-management-kubo-works-projects.com"

      - name: ビルド出力確認
        run: |
          if [ ! -d apps/web/out ]; then
            echo "::error::apps/web/out が存在しません。next build が output: export モードで実行されたか確認してください。"
            exit 1
          fi
          ls -la apps/web/out

      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: S3 へデプロイ
        run: |
          aws s3 sync apps/web/out s3://aws.patient-management-kubo-works-projects.com \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync apps/web/out s3://aws.patient-management-kubo-works-projects.com \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"

      - name: CloudFront キャッシュ無効化
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='aws.patient-management-kubo-works-projects.com']].Id" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
