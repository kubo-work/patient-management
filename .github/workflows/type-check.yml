name: Type Check

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリチェック
        uses: actions/checkout@v7

      - name: bun セットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: インストール
        run: bun install --frozen-lockfile

      - name: 型チェック（monorepo 全体）
        run: bun run typecheck
