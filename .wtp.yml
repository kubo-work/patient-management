version: "1.0"
defaults:
  # ワークツリーが作成されるベースディレクトリ
  base_dir: "../worktrees"
hooks:
  post_create:
    # API の .env ファイルをコピー
    - type: copy
      from: "packages/api/.env"
      to: "packages/api/.env"

    # web の .env ファイルをコピー
    - type: copy
      from: "apps/web/.env"
      to: "apps/web/.env"

    # monorepo 全体の依存を一括で解決する
    - type: command
      command: "bun install"
